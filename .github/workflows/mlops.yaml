name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
        
    - name: Lint Code (Syntax Check)
      run: |
        # Stop the build if there are critical Python syntax errors
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Pipeline Smoke Test
      run: |
        # Run ingestion and training to verify code executes without crashing
        python src/data_ingestion.py
        python src/train.py
        
    - name: Verify Docker Build
      run: |
        # Test that the Dockerfile builds successfully
        docker build -t california-housing-api:latest .
    
    - name: Verify Docker Compose Build
          run: |
            # Test that all custom Dockerfiles in the compose stack build successfully
            docker compose build