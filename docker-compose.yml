version: '3.8'

services:
  # 1. PostgreSQL (Backend Store for MLflow)
  db:
    image: postgres:15-alpine
    container_name: mlflow_postgres
    restart: always
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpassword
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    networks:
      - ml-network

  # 2. MinIO (Artifact Store for Models)
  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ml-network

  # 3. MinIO Bucket Initialization Helper
  createbuckets:
    image: minio/mc:latest
    container_name: mlflow_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb localminio/mlflow-artifacts --ignore-existing;
      exit 0;
      "
    networks:
      - ml-network

  # 4. MLflow Tracking Server
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    restart: always
    depends_on:
      - db
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflowpassword@db:5432/mlflowdb
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
    networks:
      - ml-network

  # 5. FastAPI Inference Service (Your Day 3/5 App)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model_inference_api
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge
